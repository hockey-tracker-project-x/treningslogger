<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Logg inn - Treningslogger</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0d1b2a" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon-32.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body style="padding-bottom: 0;">
  <div class="login-screen">
    <div class="logo">🏒</div>
    <h1>Treningslogger</h1>
    <p class="tag">Logg treningsøkter, følg utviklingen og hold motivasjonen oppe - sesong etter sesong.</p>

    <button type="button" class="btn-google" id="google-login-btn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.9 6 29.7 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.9 6 29.7 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.6 0 10.7-1.9 14.6-5.2l-6.7-5.7c-2 1.5-4.7 2.4-7.9 2.4-5.3 0-9.7-3.1-11.3-7.4l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.7l6.7 5.7C41.4 36 44 30.6 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
      Logg inn med Google
    </button>

    <p class="login-note">Kun godkjente Google-kontoer får tilgang til treningsloggen.</p>
    <p class="login-error" id="login-error" style="display:none;"></p>
  </div>

  <script type="module">
    import { auth, loginWithGoogle } from "./js/auth.js";
    import { upsertUserProfile } from "./js/db.js";
    import { isEmailAllowed } from "./js/auth.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const errorEl = document.getElementById("login-error");

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = "block";
    }

    // Hvis allerede innlogget (og godkjent), gå rett til dashboard.
    onAuthStateChanged(auth, (user) => {
      if (user && isEmailAllowed(user.email)) {
        window.location.href = "index.html";
      }
    });

    document.getElementById("google-login-btn").addEventListener("click", async () => {
      errorEl.style.display = "none";
      try {
        const result = await loginWithGoogle();
        if (result && result.user) {
          if (!isEmailAllowed(result.user.email)) {
            await signOut(auth);
            showError(
              "Denne kontoen (" + result.user.email + ") har ikke tilgang. Be om å bli lagt til, eller logg inn med riktig konto."
            );
            return;
          }
          await upsertUserProfile(result.user);
          window.location.href = "index.html";
        }
      } catch (err) {
        console.error(err);
        if (err.code === "auth/configuration-not-found" || err.code === "auth/invalid-api-key") {
          showError("Firebase er ikke satt opp ennå. Se SETUP.md for oppsettsteg.");
        } else {
          showError("Innlogging feilet: " + (err.message || err.code || "ukjent feil"));
        }
      }
    });
  </script>
  <script src="js/sw-register.js"></script>
</body>
</html>
